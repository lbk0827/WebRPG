# develop 에 푸시할 때마다 웹 훈련장을 GitHub Pages 로 배포한다.
# https://lbk0827.github.io/WebRPG/
name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 저장소에 Pages 가 아직 켜져 있지 않으면 켠다 (Source: GitHub Actions)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /WebRPG/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
